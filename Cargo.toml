[package]
name = "did_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "did_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = ["http-resolver"]
http-resolver = ["dep:reqwest"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
bs58 = "0.5"
hex = "0.4"
chrono = { version = "0.4.44", features = ["serde"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
k256 = { version = "0.13", features = ["schnorr", "sha256"] }
once_cell = "1.21.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
zeroize = { version = "1.7", features = ["derive", "zeroize_derive"] }

[dev-dependencies]
bs58 = "0.5"
hex = "0.4"
serde_json = "1.0"
sha2 = "0.10"
